<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,follow" />
  <title>Not found</title>
  <script>
    // If someone hits /tr or /tr/ and it's not generated, send them home.
    const path = window.location.pathname.replace(/\/+$/, "");
    if (path === "/tr") {
      window.location.replace("/");
    }
  </script>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px;">
  <h1>404</h1>
  <p>This page could not be found. <a href="/">Go home</a></p>
</body>
</html>
